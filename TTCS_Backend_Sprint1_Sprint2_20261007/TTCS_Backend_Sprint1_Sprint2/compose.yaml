name: ttcs-handoff
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ttcs_handoff}
      POSTGRES_USER: ${DB_USERNAME:-ttcs_handoff}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run Initialize-Environment.ps1 first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
  backend:
    build: .
    env_file: .env
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ttcs_handoff}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  postgres_data:
